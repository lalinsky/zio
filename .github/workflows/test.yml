name: CI

on:
  push:
    branches: [ main ]
    tags:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.zig_version }}, ${{ matrix.mode }}, ${{ matrix.config.os }}, ${{ matrix.config.target }})
    strategy:
      fail-fast: false
      matrix:
        zig_version: ['0.17.0']
        mode: [debug, release]
        config:
          - { os: ubuntu-24.04, target: native, backends: [linux, io_uring, epoll, poll] }
          - { os: ubuntu-24.04-arm, target: native, backends: [linux, io_uring, epoll, poll] }
          - { os: macos-latest, target: native, backends: [kqueue, poll] }
          - { os: macos-15-intel, target: native, backends: [kqueue, poll] }
          - { os: windows-latest, target: native, backends: [iocp, poll] }
          - { os: ubuntu-latest, target: arm-linux, qemu: true, backends: [linux, epoll, poll] }
          - { os: ubuntu-latest, target: thumb-linux, qemu: true, backends: [linux, epoll, poll] }
          - { os: ubuntu-latest, target: x86-linux, qemu: true, backends: [linux, epoll, poll] }
          - { os: ubuntu-latest, target: riscv32-linux, qemu: true, backends: [linux, epoll, poll] }
          - { os: ubuntu-latest, target: riscv64-linux, qemu: true, backends: [linux, epoll, poll] }
          - { os: ubuntu-latest, target: loongarch64-linux, qemu: true, backends: [linux, epoll, poll] }
          - { os: ubuntu-latest, target: powerpc64le-linux, qemu: true, backends: [linux, epoll, poll] }
          - { os: ubuntu-latest, target: x86_64-freebsd, vm: freebsd, backends: [kqueue, poll] }
          - { os: ubuntu-latest, target: x86_64-netbsd, vm: netbsd, backends: [kqueue, poll] }
          - { os: ubuntu-latest, target: x86_64-openbsd, vm: openbsd, backends: [kqueue, poll] }

    runs-on: ${{ matrix.config.os }}

    env:
      TEST_VERBOSE: 2
      MODE: ${{ matrix.mode }}
      TARGET: ${{ matrix.config.target }}
      QEMU: ${{ matrix.config.qemu }}
      VM: ${{ matrix.config.vm }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: ${{ matrix.zig_version }}
        cache-key: ${{ matrix.mode }}-${{ matrix.config.target }}

    - name: Install QEMU
      if: matrix.config.qemu
      run: |
        sudo apt-get update -q -y
        sudo apt-get install -q -y qemu-user-static

    - name: Build and test (${{ matrix.config.backends[0] }})
      if: matrix.config.backends[0]
      shell: bash
      run: bash .github/scripts/check-backend.sh
      timeout-minutes: 10
      env:
        BACKEND: ${{ matrix.config.backends[0] }}

    - name: Build and test (${{ matrix.config.backends[1] }})
      if: matrix.config.backends[1]
      shell: bash
      run: bash .github/scripts/check-backend.sh
      timeout-minutes: 10
      env:
        BACKEND: ${{ matrix.config.backends[1] }}

    - name: Build and test (${{ matrix.config.backends[2] }})
      if: matrix.config.backends[2]
      shell: bash
      run: bash .github/scripts/check-backend.sh
      timeout-minutes: 10
      env:
        BACKEND: ${{ matrix.config.backends[2] }}

    - name: Build and test (${{ matrix.config.backends[3] }})
      if: matrix.config.backends[3]
      shell: bash
      run: bash .github/scripts/check-backend.sh
      timeout-minutes: 10
      env:
        BACKEND: ${{ matrix.config.backends[3] }}

    - name: Run tests (FreeBSD VM)
      if: matrix.config.vm == 'freebsd'
      uses: vmactions/freebsd-vm@v1
      timeout-minutes: 20
      with:
        envs: 'TEST_VERBOSE'
        run: |
          for test in zig-out/bin/test-*; do
            echo "Running $test"
            ./$test
          done
      env:
        TEST_VERBOSE: 2

    - name: Run tests (NetBSD VM)
      if: matrix.config.vm == 'netbsd'
      uses: vmactions/netbsd-vm@v1
      timeout-minutes: 20
      with:
        release: '10.1'
        envs: 'TEST_VERBOSE'
        run: |
          for test in zig-out/bin/test-*; do
            echo "Running $test"
            ./$test
          done
      env:
        TEST_VERBOSE: 2

    - name: Run tests (OpenBSD VM)
      if: matrix.config.vm == 'openbsd'
      uses: vmactions/openbsd-vm@v1
      timeout-minutes: 20
      with:
        envs: 'TEST_VERBOSE'
        run: |
          # OpenBSD's default per-process fd limit is low; the max-executors
          # test opens a loop (and waker fds) per executor and needs more.
          ulimit -n 4096
          for test in zig-out/bin/test-*; do
            echo "Running $test"
            ./$test
          done
      env:
        TEST_VERBOSE: 2

  # The scheduling discipline is a compile-time choice, so the pinned and
  # single-executor paths are only covered by building against them.
  scheduling:
    strategy:
      fail-fast: false
      matrix:
        zig_version: ['0.17.0']
        mode: [debug, release]
        scheduling: [pinned, single_executor]

    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: ${{ matrix.zig_version }}
        cache-key: ${{ matrix.mode }}-${{ matrix.scheduling }}

    # The examples do not depend on the scheduling mode, so the test jobs
    # already build them.
    - name: Build and test
      shell: bash
      run: |
        ./check.sh --scheduling ${{ matrix.scheduling }} \
          ${{ matrix.mode == 'release' && '--release' || '' }}
      timeout-minutes: 10
      env:
        TEST_VERBOSE: 2

  # setup-zig saves a new cache entry on every run and never removes the old
  # ones, although a restore only ever takes the newest. Delete the superseded
  # entries, and those of pull requests that are no longer open, so the
  # repository's cache quota holds one entry per job.
  cache-cleanup:
    needs: [test, scheduling]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
    - name: Delete superseded Zig caches
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        declare -A open seen
        for n in $(gh pr list --state open --limit 1000 --json number --jq '.[].number'); do
          open[$n]=1
        done
        gh cache list --key setup-zig-cache- --sort created_at --order desc --limit 1000 \
            --json id,ref,key --jq '.[] | [.id, .ref, .key] | @tsv' |
        while IFS=$'\t' read -r id ref key; do
          # The key ends in <run id>-<run attempt>; the rest names the job.
          job="$ref ${key%-*-*}"
          if [[ $ref =~ ^refs/pull/([0-9]+)/ ]] && [ -z "${open[${BASH_REMATCH[1]}]:-}" ]; then
            echo "Deleting $key ($ref, pull request closed)"
          elif [ -n "${seen[$job]:-}" ]; then
            echo "Deleting $key ($ref, superseded)"
          else
            seen[$job]=1
            continue
          fi
          gh cache delete "$id"
        done
